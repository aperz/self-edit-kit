# Publish main to GitHub Pages: https://aperz.github.io/self-edit-kit/
# The site lives in a subfolder here (/self-edit-kit/); that needs no setting,
# because the build writes every internal link relative to its page.
# Same build + checks as CI and Netlify; if they fail, nothing is published
# and the previous version stays online. Only main is published (no PR
# previews; those come from Netlify). PROTECTED file.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write      # allowed to publish the site
  id-token: write   # proves to Pages that this run comes from this repo
concurrency:
  group: pages
  cancel-in-progress: false  # an older build never overwrites a newer one
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Eleventy renders the site. `npm ci` installs exactly the versions in
      # package-lock.json (and fails if it disagrees with package.json);
      # `npx --no` never downloads anything on its own.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: python3 checks/validate_content.py && npx --no @11ty/eleventy && python3 checks/check_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
